version: 2
models:
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: dim_user
    columns:
      - name: user_id
        tests: [unique, not_null]
  - name: fct_purchases
    columns:
      - name: purchase_key
        tests: [unique, not_null]
      - name: user_id
        tests:
          - relationships:
              to: ref('dim_user')
              field: user_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
