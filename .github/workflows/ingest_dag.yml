name: Daily Data Ingestion Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Tự động chạy vào 0h sáng mỗi ngày
  workflow_dispatch:     # Nút bấm chạy thủ công trên giao diện GitHub

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install duckdb kagglehub pandas

      - name: Execute Ingestion Script
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python ingest.py
