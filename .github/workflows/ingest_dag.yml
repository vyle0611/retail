name: Daily Data Pipeline (Ingest & Transform)

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install "duckdb==1.5.6" kagglehub pandas dbt-duckdb

      - name: Execute Ingestion
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python ingest.py
      - name: Run dbt Transformations
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          dbt run --profiles-dir .
          dbt test --profiles-dir .
